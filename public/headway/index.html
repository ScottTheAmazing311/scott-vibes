  scopes: 'Headway needs calendar access. Sign in again and leave the calendar boxes ticked.',
  expired: 'Sign-in took too long. Try again.',
  google_error: 'Google couldn’t finish sign-in. Try again.',
};
let gBusy = false, gLast = 0;
async function gLoad() {
  if (gBusy) return;
  gBusy = true;
  try {
    if (!S.cals.length) {
      try {
        const cl = await G.api('/users/me/calendarList?maxResults=100');
        S.cals = (cl.items || []).map(c => ({ id: c.primary ? 'primary' : c.id, summary: c.summaryOverride || c.summary || c.id, description: c.description || '' }));
        const p = (cl.items || []).find(c => c.primary);
        if (p) { S.me = p.id; S.domain = domainOf(p.id); }
      } catch (e) { if (e.code !== 'forbidden') throw e; }
    }
    const a = sod(new Date()), b = addDays(a, 7);
    const qs = `timeMin=${encodeURIComponent(a.toISOString())}&timeMax=${encodeURIComponent(b.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=250`;
    const results = await Promise.all(prefs.calendars.map(cal =>
      G.api(`/calendars/${encodeURIComponent(cal)}/events?${qs}`).then(r => [cal, r]).catch(e => { if (cal === 'primary') throw e; return [cal, null]; })));
    S.raw = {};
    for (const [cal, r] of results) {
      if (!r) continue;
      S.raw[cal] = r.items || [];
      if (cal === 'primary' && !S.me && typeof r.summary === 'string' && r.summary.includes('@')) { S.me = r.summary; S.domain = domainOf(r.summary); }
    }
    S.status = 'live'; S.err = null; S.updatedAt = Date.now();
  } catch (e) {
    if (e.code === 'signed_out' || e.code === 'not_configured') {
      S.status = 'signin'; S.raw = {}; S.cals = [];
      S.err = e.code === 'not_configured' ? { msg: SIGNIN_ERR.not_configured } : null;
    } else if (e.code === 'forbidden') {
      S.err = { msg: 'Google Calendar refused access. Sign out, sign in again, and allow calendar access.' };
    } else {
      S.err = { msg: `Couldn’t reach Google Calendar${e.message ? ' (' + e.message + ')' : ''}. Showing the last good schedule.` };
      if (S.status !== 'live') S.status = 'signin';
    }
  } finally {
    gBusy = false; gLast = Date.now();
  }
  rebuild(); renderAll();
}
function hostedBoot() {
  const q = new URLSearchParams(location.search);
  const e = q.get('error');
  if (e) { S.err = { msg: SIGNIN_ERR[e] || 'Sign-in didn’t finish. Try again.' }; history.replaceState(null, '', location.pathname + location.hash); }
  S.status = 'connecting'; renderHeader(new Date());
  gLoad();
  setInterval(() => { if (S.status === 'live' && document.visibilityState === 'visible') gLoad(); }, 5 * 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.status === 'live' && Date.now() - gLast > 60000) gLoad();
  });
}

// ---------- the Mac widget's Calendar app (via the native shell) ----------
const N = {
  call(op, args = {}) { return window.webkit.messageHandlers.headway.postMessage({ op, ...args }); },
  send(op, args = {}) { N.call(op, args).catch(() => {}); },
};
// on first launch, also ride every calendar named after an account (personal and work), not just the default one
let nBusy = false, nAgain = false, nTimer = 0, nSeed = !('calendars' in store.get());
async function nLoad() {
  if (nBusy) { nAgain = true; return; }
  nBusy = true;
  try {
    const a = sod(new Date());
    const r = await N.call('load', { start: a.toISOString(), end: addDays(a, 7).toISOString(), calendars: prefs.calendars });
    S.nativeLogin = !!r.login;
    if (!r.access) { S.status = 'noaccess'; S.raw = {}; S.cals = []; }
    else {
      S.cals = r.calendars || []; S.me = r.me || null; S.raw = r.events || {};
      S.status = 'live'; S.err = null; S.updatedAt = Date.now();
      if (nSeed) {
        nSeed = false;
        const extra = S.cals.filter(c => c.main && c.id !== 'primary').map(c => c.id);
        if (extra.length) { prefs.calendars = ['primary', ...extra]; save(); nAgain = true; }
      }
    }
  } catch (e) {
    S.err = { msg: `Couldn’t read your calendars (${e?.message || 'error'}). Showing the last good schedule.` };
  } finally { nBusy = false; }
  rebuild(); renderAll();
  if (nAgain) { nAgain = false; nLoad(); }
}
function nativeBoot() {
  // the shell calls these: mode('compact'|'full') when the tab opens or tucks away, changed() when Calendar's data moves
  window.headwayNative = {
    mode(m) { document.body.classList.toggle('compact', m === 'compact'); renderAll(); },
    changed() { clearTimeout(nTimer); nTimer = setTimeout(nLoad, 400); },
  };
  S.status = 'connecting'; renderAll();
  nLoad();
  setInterval(nLoad, 5 * 60000);
  // the tab: click opens it, dragging slides it along the screen edge, right-click for the menu
  const mini = $('#mini');
  let drag = null;
  mini.addEventListener('pointerdown', ev => { if (ev.button !== 0) return; drag = { y: ev.screenY, moved: false }; mini.setPointerCapture(ev.pointerId); });
  mini.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dy = ev.screenY - drag.y;
    if (!drag.moved && Math.abs(dy) < 4) return;
    drag.moved = true; drag.y = ev.screenY; N.send('drag', { dy });
  });
  mini.addEventListener('pointerup', () => { if (drag) N.send(drag.moved ? 'dragEnd' : 'expand'); drag = null; });
  mini.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') N.send('expand'); });
  mini.addEventListener('contextmenu', ev => { ev.preventDefault(); N.send('menu'); });
  $('#collapseBtn').addEventListener('click', () => N.send('collapse'));
}

async function boot() {
  if (HOSTED) return hostedBoot();
  if (NATIVE) return nativeBoot();
  let mcp = null, perms = null;
  try { mcp = await window.claude?.use?.('mcp'); } catch {}
  if (!mcp) { S.status = 'unavailable'; renderAll(); return; }
  S.mcp = mcp;
  try { perms = await window.claude.use('permissions'); } catch {}
  let st = 'prompt';
  if (perms) st = await perms.state('mcp:' + SERVER).catch(() => 'unavailable');
  if (st === 'granted') connect();
  else { S.status = 'ask'; renderAll(); }
}
async function managePerms() {
  try { const perms = await window.claude.use('permissions'); await perms?.manage(); } catch { toast('Open this artifact’s Permissions menu to turn Google Calendar on.'); return; }
  connect();
}

// ---------- routing + render loop ----------
const VIEWS = ['board', 'line', 'week', 'lines'];
function route() {
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'board';
  S.view = v;
  for (const name of VIEWS) {
    const el = $('#v-' + name);
    el.classList.toggle('is-active', name === v);
    el.classList.toggle('side-default', v === 'board' && name === 'line');
  }
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.v === v) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    t.classList.toggle('desk-current', v === 'board' && t.dataset.v === 'line');
  });
}
function renderLive(now) {
  renderHeader(now); renderLED(now); renderBoard(now); renderLine(now); renderWeek(now); renderPlatform(now); renderMini(now);
}
function renderAll() { const now = new Date(); renderLive(now); renderLines(); }

let lastMinute = -1;
function tick() {
  const now = new Date();
  const k = sod(now).getTime();
  if (k !== S.dayKey) { S.dayKey = k; S.day = 0; if (HOSTED && S.status === 'live') gLoad(); else if (NATIVE) nLoad(); else if (S.mcp && Object.keys(S.watches).length) startWatches(); rebuild(); renderAll(); }
  const [hm, ap] = tParts(now);
  const clock = esc(hm).replace(':', '<b>:</b>') + (ap ? ' ' + ap : '');
  $('#ledClock').innerHTML = clock;
  if (!$('#platform').hidden) $('#pfClock').innerHTML = clock;
  if (now.getMinutes() !== lastMinute) { lastMinute = now.getMinutes(); renderLive(now); }
  checkArrivals(now);
}

// ---------- events ----------
document.addEventListener('click', ev => {
  const t = ev.target;
  const open = t.closest('[data-open]'); if (open) { openStop(open.dataset.open); return; }
  const f = t.closest('[data-filter]'); if (f) { S.filter = S.filter === f.dataset.filter ? null : f.dataset.filter; renderLive(new Date()); return; }
  const dchip = t.closest('.daychip, .wk-row');
  if (dchip) { S.day = Number(dchip.dataset.day) || 0; if (dchip.classList.contains('wk-row')) location.hash = 'line'; renderLine(new Date()); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'connect') connect();
    else if (a === 'manage') managePerms();
    else if (a === 'refresh' && HOSTED) { gLoad(); toast('Refreshing'); }
    else if (a === 'refresh' && NATIVE) { N.send('refresh'); nLoad(); toast('Refreshing'); }
    else if (a === 'privacy' || a === 'quit') N.send(a);
    else if (a === 'refresh' && S.mcp) { S.mcp.invalidate(SERVER, 'list_events').catch(() => {}); toast('Refreshing'); }
    return;
  }
  if (audio && prefs.sound && AC && AC.state === 'suspended') AC.resume().catch(() => {});
});
$('#alldayBtn').addEventListener('click', openAllDay);
$('#addBtn').addEventListener('click', openAdd);
$('#platformBtn').addEventListener('click', openPlatform);
$('#pfExit').addEventListener('click', closePlatform);
$('#earlierBtn').addEventListener('click', () => { S.showEarlier = !S.showEarlier; renderBoard(new Date()); });
$('#soundBtn').addEventListener('click', () => {
  prefs.sound = !prefs.sound; save();
  $('#soundBtn').setAttribute('aria-pressed', prefs.sound);
  if (prefs.sound) { sound('door'); toast('Arrival chime on'); } else toast('Arrival chime off');
  renderLines();
});
$('#soundBtn').setAttribute('aria-pressed', prefs.sound);
window.addEventListener('hashchange', route);

// lines roster: text edits update in place; structural edits re-render
function editLine(id, patch) {
  const c = prefs.custom.find(x => x.id === id);
  if (c) Object.assign(c, patch); else prefs.lineEdits[id] = { ...(prefs.lineEdits[id] || {}), ...patch };
}
$('#v-lines').addEventListener('change', ev => {
  const t = ev.target;
  const row = t.closest('[data-line]');
  if (row && t.matches('.ln-name, .ln-letter, .ln-kw')) {
    const id = row.dataset.line;
    if (t.matches('.ln-name')) editLine(id, { name: t.value.trim() || 'Untitled line' });
    if (t.matches('.ln-letter')) { const L = (t.value.trim() || '?').slice(0, 1).toUpperCase(); t.value = L; editLine(id, { letter: L }); }
    if (t.matches('.ln-kw')) editLine(id, { keywords: t.value.split(',').map(s => s.trim()).filter(Boolean) });
    save(); rebuild();
    row.querySelector('.ln-bullet').innerHTML = bullet(lineById(id), { size: 'lg' });
    renderLive(new Date());
    return;
  }
  if (t.matches('[data-cal]')) {
    const id = t.dataset.cal;
    prefs.calendars = t.checked ? [...new Set([...prefs.calendars, id])] : prefs.calendars.filter(x => x !== id);
    if (!prefs.calendars.length) { prefs.calendars = ['primary']; t.checked = id === 'primary'; }
    save(); if (HOSTED) gLoad(); else if (NATIVE) nLoad(); else if (S.mcp) startWatches(); return;
  }
  if (t.matches('[data-login]')) { N.call('login', { on: t.checked }).then(on => { S.nativeLogin = !!on; }).catch(() => {}); return; }
  if (t.matches('[data-pref]')) {
    prefs[t.dataset.pref] = t.checked; save();
    if (t.dataset.pref === 'sound') { $('#soundBtn').setAttribute('aria-pressed', prefs.sound); if (prefs.sound) sound('door'); }
    if (t.dataset.pref === 'voice' && prefs.voice) { const was = prefs.voice; prefs.voice = true; say('Headway announcements are on.'); prefs.voice = was; }
    renderLive(new Date());
  }
});
$('#v-lines').addEventListener('click', ev => {
  const t = ev.target;
  const row = t.closest('[data-line]');
  if (t.closest('#addLine')) {
    const used = new Set(lines().map(l => l.letter));
    const letter = ['A', 'C', 'D', 'G', 'J', 'L', 'N', 'R', 'W', 'Z', '2', '3', '5', '6'].find(x => !used.has(x)) || 'A';
    const id = 'c' + Date.now().toString(36);
    prefs.custom.push({ id, letter, color: 'lime', name: 'New line', keywords: [], custom: true, rule: '' });
    save(); renderLines(); document.getElementById('kw-' + id)?.focus();
    return;
  }
  if (!row) return;
  const id = row.dataset.line;
  const sw = t.closest('[data-color]');
  if (sw) editLine(id, { color: sw.dataset.color });
  else if (t.closest('[data-hide]')) prefs.hidden = prefs.hidden.includes(id) ? prefs.hidden.filter(x => x !== id) : [...prefs.hidden, id];
  else if (t.closest('[data-del]')) { prefs.custom = prefs.custom.filter(x => x.id !== id); prefs.hidden = prefs.hidden.filter(x => x !== id); }
  else return;
  save(); rebuild(); renderAll();
});

// ---------- go ----------
rebuild();
route();
renderAll();
tick();
setInterval(tick, 1000);
boot();
})();
</script>
</body>
</html>
